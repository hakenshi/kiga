appId: com.kiga.mobile
---
- launchApp:
    clearState: true
- tapOn: "Começar agora - Criar Conta"
- assertVisible: "Primeiro Nome"
- assertVisible: "Sobrenome"
- assertVisible: "Nome de Usuário"
- assertVisible: "Data de Nascimento"
- tapOn:
    id: "register-continue-button"
- assertVisible: "Informe o primeiro nome"
- tapOn:
    id: "register-firstname-input"
- inputText: "Teste"
- hideKeyboard
- tapOn:
    id: "register-secondname-input"
- inputText: "Local"
- hideKeyboard
- evalScript: ${output.username = 'e2e_' + Date.now()}
- tapOn:
    id: "register-username-input"
- inputText: ${output.username}
- hideKeyboard
- tapOn:
    id: "register-birthdate-input"
- inputText: "29022000"
- hideKeyboard
- tapOn:
    id: "register-continue-button"
- assertVisible: "Crie sua senha"
- tapOn:
    id: "register-password-input"
- inputText: "minhasenha123"
- hideKeyboard
- tapOn:
    id: "register-confirm-password-input"
- inputText: "senhadiferente"
- hideKeyboard
- tapOn:
    id: "register-security-continue-button"
- assertVisible: "As senhas não coincidem"
- tapOn:
    id: "register-confirm-password-input"
- eraseText
- inputText: "minhasenha123"
- hideKeyboard
- tapOn:
    id: "register-security-continue-button"
- assertVisible: "Gênero"
- assertVisible: "Pronome"
- tapOn:
    id: "gender-other"
- tapOn:
    id: "pronoun-other"
- tapOn:
    id: "register-identity-continue-button"
- assertVisible: "PIN"
- assertVisible: "Crie um PIN de 4 a 6 dígitos para proteger sua conta"
- tapOn: "^1$"
- tapOn: "^2$"
- tapOn: "^3$"
- tapOn:
    id: "register-pin-submit-button"
- assertVisible: "O PIN deve ter no mínimo 4 dígitos"
- tapOn: "^4$"
- tapOn:
    id: "register-pin-submit-button"
- assertVisible: "Feed"
- assertVisible: "Filtros"
