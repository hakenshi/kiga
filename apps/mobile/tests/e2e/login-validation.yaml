appId: com.kiga.mobile
---
- launchApp:
    clearState: true
- tapOn: "Fazer Login"
- assertVisible: "Nome de Usuário"
- assertVisible: "Senha"
- tapOn:
    id: "login-button"
- assertVisible: "Informe o nome de usuário"
- tapOn:
    id: "username-input"
- inputText: "conta_inexistente_e2e"
- hideKeyboard
- tapOn:
    id: "login-button"
- assertVisible: "Informe a senha"
- tapOn:
    id: "password-input"
- inputText: "12"
- hideKeyboard
- tapOn:
    id: "login-button"
- assertVisible: "A senha deve ter no mínimo 3 caracteres"
- tapOn:
    id: "password-input"
- eraseText
- inputText: "senhaerrada"
- hideKeyboard
- tapOn:
    id: "login-button"
- assertVisible: "Nome de usuário ou senha incorretos"
- assertNotVisible: "Filtros"
